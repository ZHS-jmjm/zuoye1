<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 食鉴 AI 营养分析师</title>
  <meta name="description" content="注册食鉴账号，开始你的 AI 健康饮食之旅">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-wrap">
    <!-- 底层：左侧绿色调食材图 -->
    <aside class="login-brand">
      <img src="image/green-food_1.jpg" alt="绿色调轻食" class="login-bg">
      <div class="login-brand-inner">
        <div class="brand-head">
          <span class="login-logo">🥗</span>
          <h2>食鉴</h2>
        </div>
        <p class="brand-sub">AI 营养分析师</p>
        <p class="brand-tag">创建你的账号，开启 AI 健康饮食之旅</p>
      </div>
    </aside>

    <!-- 上层：右侧红色调食材图（左侧斜向渐变淡入） -->
    <img src="image/red-food_1.jpg" alt="" class="login-bg-right">

    <!-- 注册表单 -->
    <main class="login-panel">
      <div class="login-card">
        <h1>创建账号 🎉</h1>
        <p class="login-sub">注册一个账号，开始记录饮食</p>

        <form id="register-form" novalidate>
          <label class="field">
            <span>用户名</span>
            <input type="text" id="username" maxlength="20" autocomplete="username" placeholder="至少 2 个字符">
          </label>
          <label class="field">
            <span>密码</span>
            <input type="password" id="password" maxlength="30" autocomplete="new-password" placeholder="至少 6 位">
          </label>
          <label class="field">
            <span>确认密码</span>
            <input type="password" id="password2" maxlength="30" autocomplete="new-password" placeholder="再输一遍密码">
          </label>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">注 册 并 登 录</button>
        </form>

        <p class="login-switch">已有账号？<a href="index.html">返回登录 →</a></p>
        <p class="login-hint">注册成功后会自动登录，直接进入主页面</p>
      </div>
    </main>

    <div class="login-footer">
      <span>本作品为网页开发竞赛参赛作品，营养数据仅供参考。</span>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
  <script src="js/global-ui.js"></script>
</body>
</html>
